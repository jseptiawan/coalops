# =============================================================================
# docker-compose.yml – run CoalOps with one command
#
#   docker compose up --build
#
# Then open http://localhost:3000
# =============================================================================
services:
  coalops:
    build:
      context: .
      dockerfile: Dockerfile
    image: coalops:1.0
    container_name: coalops
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # --- AI Executive Summary (Module 19) ---
      # Set one of these to enable a real LLM provider; leave empty to use
      # the deterministic rule-based fallback (the same demo content).
      LLM_PROVIDER: "${LLM_PROVIDER:-fallback}"   # fallback | anthropic | openai
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
      # --- Internationalization ---
      DEFAULT_LOCALE: "${DEFAULT_LOCALE:-en}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # If you want to mount a real config / data dir later:
    # volumes:
    #   - ./data:/app/data:ro
